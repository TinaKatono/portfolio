<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TINA KATONO</title>
    <!-- favicon: ブランドの青い目玉マーク（fv_2_eyes.svg）。タブは透過 SVG、iOS ホーム画面は背景付き PNG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      OGP / Twitter Card: URL を共有したときのプレビュー用。noindex（検索避け）とは別物で、
      検索インデックスには影響しない。og:image は絶対 URL 必須なので本番ドメインを直書きする。
      画像は public/og.png（1200x630、ブランドのワードマーク）。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tinakatono.com/" />
    <meta property="og:title" content="TINA KATONO" />
    <meta
      property="og:description"
      content="東京を拠点に UI/UX を軸に活動するウェブデザイナー、TINA KATONO のポートフォリオ。"
    />
    <meta property="og:image" content="https://tinakatono.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TINA KATONO" />
    <meta
      name="twitter:description"
      content="東京を拠点に UI/UX を軸に活動するウェブデザイナー、TINA KATONO のポートフォリオ。"
    />
    <meta name="twitter:image" content="https://tinakatono.com/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
